[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "portolan"
version = "0.1.0"
description = "Compile any web app's hidden API into typed, tested tools for AI agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "mcp>=1.0",
  "anyio>=4",
]

[project.optional-dependencies]
fixtures = ["fastapi>=0.110", "uvicorn>=0.29"]
record = ["playwright>=1.44"]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8", "fastapi>=0.110", "uvicorn>=0.29", "ruff>=0.5"]

[project.scripts]
portolan = "portolan.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["portolan"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B905"]
